# チェックのみ(自動修正しない)。失敗したら手で直してから再コミットする
pre-commit:
  parallel: true
  jobs:
    - name: backend-ruff
      root: backend/
      glob:
        - "backend/*.py"
        - "backend/**/*.py"
        - "backend/pyproject.toml"
      run: uv run ruff check . && uv run ruff format --check .
    - name: backend-ty
      root: backend/
      glob: &backend
        - "backend/*.py"
        - "backend/**/*.py"
        - "backend/pyproject.toml"
        - "backend/uv.lock"
      run: uv run ty check
    - name: backend-pytest
      root: backend/
      glob: *backend
      run: uv run pytest -q
    # frontend の Python スクリプトも backend の固定した ruff で見る(設定は frontend/scripts/ruff.toml)
    # root: を付けると backend/ 外のファイルで発火しなくなるので cd で移る
    - name: frontend-scripts-ruff
      glob:
        - "frontend/scripts/*.py"
        - "frontend/scripts/ruff.toml"
        - "backend/pyproject.toml"
      run: cd backend && uv run ruff check ../frontend/scripts && uv run ruff format --check ../frontend/scripts
    # generate:api が backend の OpenAPI を読むので backend の変更でも走らせる
    - name: frontend-check-test
      glob:
        - "frontend/src/**"
        - "frontend/scripts/**"
        - "frontend/*.json"
        - "pnpm-lock.yaml"
        - "frontend/*.ts"
        - "frontend/*.js"
        - "backend/*.py"
        - "backend/**/*.py"
        - "backend/pyproject.toml"
        - "backend/uv.lock"
      # 並列ジョブ同士で generate:api が同じファイルに書き込まないよう、テストもここで続けて走らせる
      run: cd frontend && pnpm check && pnpm exec vitest run
    - name: frontend-lint
      root: frontend/
      glob:
        - "frontend/src/**"
        - "frontend/scripts/**"
        - "frontend/*.json"
        - "frontend/*.ts"
        - "frontend/*.js"
        - "pnpm-lock.yaml"
      run: pnpm lint
    # ルート直下の設定ファイルは frontend の prettier で整形を確かめる
    - name: root-prettier
      glob:
        - "package.json"
        - "lefthook.yml"
        - "AGENTS.md"
        - "README.md"
        - "transit-map-agent.code-workspace"
        - ".claude/settings.json"
        - "pnpm-workspace.yaml"
      run: frontend/node_modules/.bin/prettier --check {staged_files}

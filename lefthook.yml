# チェックのみ(自動修正しない)。失敗したら手で直してから再コミットする
pre-commit:
  parallel: true
  jobs:
    - name: backend-ruff
      root: backend/
      glob: ["backend/*.py", "backend/**/*.py", "backend/pyproject.toml"]
      run: uv run ruff check . && uv run ruff format --check .
    - name: backend-ty
      root: backend/
      glob: ["backend/*.py", "backend/**/*.py", "backend/pyproject.toml", "backend/uv.lock"]
      run: uv run ty check
    - name: frontend-check
      glob:
        - "frontend/src/**"
        - "frontend/scripts/**"
        - "frontend/*.json"
        - "frontend/*.ts"
        - "frontend/*.js"
        - "backend/*.py"
        - "backend/**/*.py"
        - "backend/pyproject.toml"
        - "backend/uv.lock"
      run: cd frontend && npm run check
    - name: frontend-lint
      root: frontend/
      glob: ["frontend/src/**", "frontend/scripts/**", "frontend/*.json", "frontend/*.ts", "frontend/*.js"]
      run: npm run lint

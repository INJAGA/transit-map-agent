[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "INJAGA", email = "47142905+INJAGA@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ag-ui-langgraph>=0.0.47",
    "fastapi[standard]>=0.162.0",
    "langchain>=1.4.9",
    "langchain-openai>=1.7.4",
    "python-dotenv>=1.2.4",
]

[tool.ty.environment]
# エディタの ty 拡張は multi-root workspace 全体の Python を渡してくるので、backend の .venv を明示する
python = ".venv"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203", "D213", # D211 / D212 と矛盾するので片方を外す
    "COM812",       # ruff format と衝突する
    "CPY001",       # 全ファイルに著作権表記を書く運用はしない
]

[tool.ruff.lint.per-file-ignores]
# pytest は assert で書く. 偽モデルは LangChain の親クラスの Any 引数に合わせる
"test_*.py" = ["S101", "ANN401"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "ty>=0.0.97",
]
